<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eee4cf">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Hanzi Steps — Ink Study</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.3/dist/hanzi-writer.min.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="toprow">
        <button class="brand" data-action="home" aria-label="Hanzi Steps home">
          <span class="seal">漢</span>
          <span class="brandcopy">
            <strong>Hanzi Steps</strong>
            <small>Traditional Chinese · Taiwan</small>
          </span>
        </button>
        <div class="tools">
          <button class="streak" data-action="streak" aria-label="Study streak">火 <span id="streakCount">0</span></button>
          <button class="toolbtn" data-action="settings" aria-label="Settings">印</button>
        </div>
      </div>
    </header>

    <main id="app">
      <section class="loading-state">
        <div class="ink-loader">學</div>
        <h1>Opening the study scroll…</h1>
        <p>Loading the local curriculum.</p>
      </section>
    </main>

    <nav class="bottom" aria-label="Main navigation">
      <div class="bottomnav">
        <button class="navbtn active" data-nav="course"><i>學</i>Course</button>
        <button class="navbtn" data-nav="practice"><i>練</i>Practice</button>
        <button class="navbtn" data-nav="reading"><i>讀</i>Reading</button>
        <button class="navbtn" data-nav="search"><i>字</i>Search</button>
      </div>
    </nav>
  </div>

  <div class="overlay" id="overlay" hidden></div>
  <section class="sheet" id="sheet" aria-modal="true" role="dialog" hidden></section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
